name: Lint

# WoW runs Lua 5.1, so syntax and tests run under 5.1.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    container: nickblah/lua:5.1-luarocks
    steps:
      - uses: actions/checkout@v4
      - name: Check Lua 5.1 syntax
        run: find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac -p
      - name: Run tests
        run: for test in tests/test_*.lua; do lua "$test" || exit 1; done

  hammercore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: addon
      - uses: actions/checkout@v4
        with:
          repository: consecrated-hammer/HammerCore
          path: hammercore
          fetch-depth: 0
      - name: Vendored HammerCore matches its pinned commit
        run: python3 hammercore/tools/check.py addon
      - name: Each TOC loads exactly the addon's Lua files
        run: python3 hammercore/tools/toc_check.py addon
